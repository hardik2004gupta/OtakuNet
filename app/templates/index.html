<!DOCTYPE html>
<html>
<head>
    <title>Anime Recommender</title>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        input {
            padding: 10px;
            width: 300px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            background-color: #6366f1;
            color: white;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin: 40px;
        }

        .card {
            background-color: #1e293b;
            padding: 10px;
            border-radius: 10px;
        }

        img {
            width: 100%;
            border-radius: 10px;
        }

        .autocomplete {
            position: relative;
            display: inline-block;
        }

        .autocomplete-items {
            position: absolute;
            background-color: #1e293b;
            width: 100%;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
        }

        .autocomplete-items div:hover {
            background-color: #334155;
        }

        .spinner {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>🎬 Anime Recommender</h1>

<div class="autocomplete">
    <input type="text" id="animeInput" placeholder="Enter anime title" oninput="autocompleteSearch()">
    <div id="autocomplete-list" class="autocomplete-items"></div>
</div>

<button onclick="getRecommendations()">Search</button>

<div class="spinner" id="spinner">
    ⏳ Loading recommendations...
</div>

<div class="grid" id="results"></div>

<script>

// ------------------ AUTOCOMPLETE ------------------

async function autocompleteSearch() {
    const query = document.getElementById("animeInput").value;
    const list = document.getElementById("autocomplete-list");
    list.innerHTML = "";

    if (query.length < 2) return;

    const response = await fetch(`/search?query=${encodeURIComponent(query)}`);
    const data = await response.json();

    data.results.forEach(title => {
        const item = document.createElement("div");
        item.innerHTML = title;
        item.onclick = function() {
            document.getElementById("animeInput").value = title;
            list.innerHTML = "";
        };
        list.appendChild(item);
    });
}

// ------------------ RECOMMEND ------------------

async function getRecommendations() {
    const title = document.getElementById("animeInput").value;
    const spinner = document.getElementById("spinner");
    const resultsDiv = document.getElementById("results");

    resultsDiv.innerHTML = "";
    spinner.style.display = "block";

    const response = await fetch(`/recommend?title=${encodeURIComponent(title)}`);
    const data = await response.json();

    spinner.style.display = "none";

    if (data.error) {
        resultsDiv.innerHTML = "<p>Anime not found.</p>";
        return;
    }

    data.recommendations.forEach(anime => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img src="${anime.image_url}" alt="${anime.title}">
            <h3>${anime.title}</h3>
            <p>⭐ ${anime.score}</p>
            <p>${anime.genres}</p>
        `;

        resultsDiv.appendChild(card);
    });
}

</script>

</body>
</html>
