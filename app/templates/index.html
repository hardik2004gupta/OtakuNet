<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anime Recommender</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sakura: #ff6b9d;
            --neon-blue: #00d4ff;
            --deep-purple: #1a0533;
            --mid-purple: #2d0a4e;
            --card-bg: rgba(255,255,255,0.04);
            --accent-gold: #ffd700;
            --glow-pink: rgba(255, 107, 157, 0.5);
            --glow-blue: rgba(0, 212, 255, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--deep-purple);
            color: white;
            font-family: 'Noto Sans JP', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── ANIMATED BACKGROUND ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(255,107,157,0.18) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 80%, rgba(0,212,255,0.15) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 60% 30%, rgba(120,40,200,0.2) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* Stars */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.8) 0%, transparent 100%),
                radial-gradient(1px 1px at 30% 40%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 55% 10%, rgba(255,255,255,0.9) 0%, transparent 100%),
                radial-gradient(1px 1px at 75% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 25%, rgba(255,255,255,0.7) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 20% 75%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 45% 85%, rgba(255,255,255,0.8) 0%, transparent 100%),
                radial-gradient(1px 1px at 65% 45%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 85% 90%, rgba(255,255,255,0.7) 0%, transparent 100%),
                radial-gradient(1px 1px at 5% 50%, rgba(255,255,255,0.6) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* ── SAKURA PETALS ── */
        .petals-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -20px;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle at 30% 30%, #ffb3d1, #ff6b9d);
            border-radius: 50% 0 50% 0;
            opacity: 0.6;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg) translateX(0); opacity: 0.7; }
            50% { transform: translateY(50vh) rotate(180deg) translateX(30px); opacity: 0.5; }
            100% { transform: translateY(100vh) rotate(360deg) translateX(-20px); opacity: 0; }
        }

        /* ── HEADER ── */
        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px 20px 40px;
        }

        .jp-subtitle {
            font-size: 0.75rem;
            letter-spacing: 6px;
            color: var(--sakura);
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0.8;
            animation: fadeDown 1s ease both;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 6vw, 4.5rem);
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, var(--sakura) 40%, var(--neon-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            letter-spacing: -1px;
            animation: fadeDown 1s ease 0.15s both;
            filter: drop-shadow(0 0 40px rgba(255,107,157,0.3));
        }

        .title-accent {
            display: block;
            font-size: 0.45em;
            letter-spacing: 8px;
            background: linear-gradient(90deg, var(--neon-blue), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 4px;
        }

        /* Decorative line */
        .header-line {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--sakura), var(--neon-blue), transparent);
            margin: 24px auto 0;
            animation: fadeDown 1s ease 0.3s both;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── SEARCH AREA ── */
        .search-section {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            flex-wrap: wrap;
            animation: fadeUp 1s ease 0.4s both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .autocomplete {
            position: relative;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            color: var(--sakura);
            font-size: 1rem;
            pointer-events: none;
            z-index: 1;
        }

        /* Scanline overlay */
        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.03) 2px,
                rgba(0,0,0,0.03) 4px
            );
            pointer-events: none;
            z-index: 2;
        }

        #animeInput {
            padding: 15px 20px 15px 48px;
            width: 380px;
            max-width: 90vw;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,107,157,0.25);
            border-radius: 50px;
            color: white;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: all 0.35s ease;
            caret-color: var(--sakura);
        }

        #animeInput::placeholder { color: rgba(255,255,255,0.3); letter-spacing: 0.5px; }

        #animeInput:focus {
            border-color: var(--sakura);
            box-shadow: 0 0 0 3px rgba(255,107,157,0.18), 0 0 40px rgba(255,107,157,0.12);
            background: rgba(255,255,255,0.09);
        }

        .autocomplete-items {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            right: 0;
            background: rgba(18, 4, 38, 0.97);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,107,157,0.25);
            border-radius: 18px;
            max-height: 240px;
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 200;
            box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04) inset;
            transform-origin: top center;
            animation: dropIn 0.2s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes dropIn {
            from { opacity: 0; transform: scaleY(0.85) translateY(-8px); }
            to   { opacity: 1; transform: scaleY(1) translateY(0); }
        }

        .autocomplete-items.hidden {
            display: none;
        }

        .autocomplete-items::-webkit-scrollbar { width: 4px; }
        .autocomplete-items::-webkit-scrollbar-track { background: transparent; }
        .autocomplete-items::-webkit-scrollbar-thumb { background: var(--sakura); border-radius: 2px; }

        .autocomplete-items div {
            padding: 11px 20px;
            cursor: pointer;
            font-size: 0.88rem;
            color: rgba(255,255,255,0.75);
            transition: background 0.15s, color 0.15s, padding-left 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .autocomplete-items div::before {
            content: '›';
            color: var(--sakura);
            font-size: 1.1rem;
            opacity: 0;
            transition: opacity 0.15s;
            flex-shrink: 0;
        }

        .autocomplete-items div:last-child { border-bottom: none; }

        .autocomplete-items div:hover,
        .autocomplete-items div.active {
            background: rgba(255,107,157,0.12);
            color: white;
            padding-left: 14px;
        }

        .autocomplete-items div:hover::before,
        .autocomplete-items div.active::before {
            opacity: 1;
        }

        /* Search Button */
        #searchBtn {
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--sakura), #c94b8f);
            border: none;
            border-radius: 50px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(255,107,157,0.3), 0 4px 20px rgba(0,0,0,0.3);
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        #searchBtn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        #searchBtn:hover::before { left: 100%; }

        #searchBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 50px rgba(255,107,157,0.5), 0 8px 30px rgba(0,0,0,0.3);
        }

        #searchBtn:active { transform: translateY(0); }

        /* ── SPINNER ── */
        .spinner {
            display: none;
            text-align: center;
            margin-top: 60px;
            position: relative;
            z-index: 10;
        }

        .spinner-ring {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255,107,157,0.1);
            border-top: 3px solid var(--sakura);
            border-right: 3px solid var(--neon-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .spinner p {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: var(--sakura);
            animation: pulse 1s ease-in-out infinite alternate;
        }

        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

        /* ── SECTION TITLE ── */
        .results-header {
            display: none;
            text-align: center;
            position: relative;
            z-index: 10;
            margin-top: 60px;
            margin-bottom: -10px;
        }

        .results-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 6px;
            color: var(--neon-blue);
            text-transform: uppercase;
        }

        /* ── GRID ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
            padding: 40px 40px 80px;
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── CARD ── */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(30px);
            animation: cardIn 0.5s ease forwards;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255,107,157,0.05), rgba(0,212,255,0.05));
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1;
        }

        .card:hover::before { opacity: 1; }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(255,107,157,0.4);
            box-shadow:
                0 20px 60px rgba(0,0,0,0.5),
                0 0 30px rgba(255,107,157,0.15),
                inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .card-img-wrapper {
            position: relative;
            overflow: hidden;
            aspect-ratio: 2/3;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            display: block;
        }

        .card:hover img { transform: scale(1.08); }

        /* Rank badge */
        .rank-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
            z-index: 3;
        }

        .rank-badge.top { border-color: rgba(255,215,0,0.5); color: var(--accent-gold); }

        /* Score badge */
        .score-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,215,0,0.35);
            border-radius: 20px;
            padding: 4px 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 2;
        }

        /* Gradient overlay on image */
        .card-img-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(10,2,20,0.9), transparent);
            pointer-events: none;
        }

        .card-body {
            padding: 14px 14px 16px;
            position: relative;
            z-index: 2;
        }

        .card h3 {
            font-size: 0.85rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 8px;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .genres {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .genre-tag {
            background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 0.65rem;
            color: var(--neon-blue);
            letter-spacing: 0.5px;
        }

        .no-results {
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 1rem;
            margin-top: 60px;
            grid-column: 1 / -1;
        }

        /* Staggered delays for cards */
        .card:nth-child(1)  { animation-delay: 0.05s; }
        .card:nth-child(2)  { animation-delay: 0.1s; }
        .card:nth-child(3)  { animation-delay: 0.15s; }
        .card:nth-child(4)  { animation-delay: 0.2s; }
        .card:nth-child(5)  { animation-delay: 0.25s; }
        .card:nth-child(6)  { animation-delay: 0.3s; }
        .card:nth-child(7)  { animation-delay: 0.35s; }
        .card:nth-child(8)  { animation-delay: 0.4s; }
        .card:nth-child(9)  { animation-delay: 0.45s; }
        .card:nth-child(10) { animation-delay: 0.5s; }

        /* ── DECORATIVE KANJI ── */
        .kanji-bg {
            position: fixed;
            bottom: -20px;
            right: 20px;
            font-size: 18rem;
            color: rgba(255,107,157,0.03);
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            pointer-events: none;
            z-index: 0;
            user-select: none;
            line-height: 1;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .grid { padding: 24px 16px 60px; gap: 16px; }
            #animeInput { width: 280px; }
            .kanji-bg { font-size: 10rem; }
        }
    </style>
</head>
<body>

<!-- Scanlines -->
<div class="scanlines"></div>

<!-- Sakura petals -->
<div class="petals-container" id="petals"></div>

<!-- Decorative background kanji -->
<div class="kanji-bg">アニメ</div>

<header>
    <p class="jp-subtitle">アニメ推薦エンジン &nbsp;/&nbsp; AI Powered Discovery</p>
    <h1>
        ANIME
        <span class="title-accent">RECOMMENDER</span>
    </h1>
    <div class="header-line"></div>
</header>

<div class="search-section">
    <div class="autocomplete">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="animeInput" placeholder="Search anime…" oninput="autocompleteSearch()" onkeydown="handleKey(event)" autocomplete="off" spellcheck="false">
        </div>
        <div id="autocomplete-list" class="autocomplete-items"></div>
    </div>
    <button id="searchBtn" onclick="getRecommendations()">SEARCH</button>
</div>

<div class="spinner" id="spinner">
    <div class="spinner-ring"></div>
    <p>LOADING RECOMMENDATIONS</p>
</div>

<div class="results-header" id="resultsHeader">
    <h2>✦ Recommended For You ✦</h2>
</div>

<div class="grid" id="results"></div>

<script>
    // ── SAKURA PETALS ──
    const container = document.getElementById('petals');
    for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'petal';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (Math.random() * 8 + 6) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        p.style.width = p.style.height = (Math.random() * 8 + 6) + 'px';
        p.style.opacity = Math.random() * 0.5 + 0.2;
        container.appendChild(p);
    }

    // ── AUTOCOMPLETE ──
    let activeIndex = -1;

    const input = document.getElementById("animeInput");
    const list  = document.getElementById("autocomplete-list");

    // Close on blur — use a small delay so mousedown on an item fires first
    input.addEventListener('blur', () => {
        setTimeout(() => closeList(), 150);
    });

    function closeList() {
        list.innerHTML = "";
        list.classList.add('hidden');
        activeIndex = -1;
    }

    function openList() {
        list.classList.remove('hidden');
    }

    async function autocompleteSearch() {
        const query = input.value;
        list.innerHTML = "";
        activeIndex = -1;
        if (query.length < 2) { closeList(); return; }

        try {
            const response = await fetch(`/search?query=${encodeURIComponent(query)}`);
            const data = await response.json();
            if (!data.results?.length) { closeList(); return; }

            openList();
            data.results.forEach((title, idx) => {
                const item = document.createElement("div");
                item.textContent = title;
                item.dataset.idx = idx;

                // ✅ FIX: mousedown fires BEFORE blur, so the list isn't gone yet
                item.addEventListener('mousedown', (e) => {
                    e.preventDefault(); // prevent input blur
                    selectItem(title);
                });
                list.appendChild(item);
            });
        } catch(e) { closeList(); }
    }

    function selectItem(title) {
        input.value = title;
        closeList();
        getRecommendations();
    }

    function handleKey(e) {
        const items = list.querySelectorAll('div');
        if (!items.length) {
            if (e.key === 'Enter') getRecommendations();
            return;
        }
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIndex = Math.min(activeIndex + 1, items.length - 1);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIndex = Math.max(activeIndex - 1, -1);
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeIndex >= 0) selectItem(items[activeIndex].textContent);
            else getRecommendations();
            return;
        } else if (e.key === 'Escape') {
            closeList(); return;
        }
        items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
        if (activeIndex >= 0) items[activeIndex].scrollIntoView({ block: 'nearest' });
    }

    // Close dropdown on outside click
    document.addEventListener('mousedown', (e) => {
        if (!e.target.closest('.autocomplete')) closeList();
    });

    // ── RECOMMEND ──
    async function getRecommendations() {
        const title = document.getElementById("animeInput").value.trim();
        if (!title) return;

        const spinner = document.getElementById("spinner");
        const resultsDiv = document.getElementById("results");
        const resultsHeader = document.getElementById("resultsHeader");

        resultsDiv.innerHTML = "";
        resultsHeader.style.display = "none";
        spinner.style.display = "block";

        try {
            const response = await fetch(`/recommend?title=${encodeURIComponent(title)}`);
            const data = await response.json();
            spinner.style.display = "none";

            if (data.error || !data.recommendations?.length) {
                resultsDiv.innerHTML = '<p class="no-results">✦ No recommendations found. Try a different title. ✦</p>';
                return;
            }

            resultsHeader.style.display = "block";
            data.recommendations.forEach((anime, idx) => {
                const card = document.createElement("div");
                card.className = "card";
                card.style.animationDelay = (idx * 0.06) + 's';

                const genres = (anime.genres || '').split(',').slice(0,3)
                    .map(g => `<span class="genre-tag">${g.trim()}</span>`).join('');

                const rankClass = idx < 3 ? 'rank-badge top' : 'rank-badge';

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <div class="${rankClass}">${idx + 1}</div>
                        <div class="score-badge">★ ${anime.score || 'N/A'}</div>
                        <img src="${anime.image_url}" alt="${anime.title}" loading="lazy"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22300%22%3E%3Crect fill=%22%231a0533%22 width=%22200%22 height=%22300%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22%23ff6b9d%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 font-size=%2236%22%3Eアニメ%3C/text%3E%3C/svg%3E'">
                    </div>
                    <div class="card-body">
                        <h3>${anime.title}</h3>
                        <div class="genres">${genres}</div>
                    </div>
                `;

                resultsDiv.appendChild(card);
            });
        } catch (e) {
            spinner.style.display = "none";
            resultsDiv.innerHTML = '<p class="no-results">✦ Connection error. Please try again. ✦</p>';
        }
    }
</script>
</body>
</html>
