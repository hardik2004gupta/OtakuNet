<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OtakuNet</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;700&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --crimson: #ff2244;
            --crimson-glow: rgba(255, 34, 68, 0.6);
            --cyan: #00f5ff;
            --cyan-glow: rgba(0, 245, 255, 0.5);
            --gold: #ffd700;
            --deep: #04060f;
            --panel: rgba(8, 14, 30, 0.85);
            --border: rgba(0, 245, 255, 0.15);
            --text: #e8eeff;
            --muted: #6a7a9a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--deep);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: crosshair;
        }

        /* ── BACKGROUND CANVAS ── */
        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-radial {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,34,68,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 50% 60% at 90% 80%, rgba(0,245,255,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 10% 60%, rgba(130,0,255,0.06) 0%, transparent 60%);
        }

        /* noise overlay */
        .bg-noise {
            position: fixed;
            inset: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }

        /* ── SCANLINES ── */
        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.04) 2px,
                rgba(0,0,0,0.04) 4px
            );
            pointer-events: none;
            z-index: 9998;
        }

        /* ── LAYOUT ── */
        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px 80px;
        }

        /* ── HEADER ── */
        header {
            padding: 48px 0 16px;
            text-align: center;
            position: relative;
        }

        .logo-badge {
            display: inline-block;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--crimson);
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeSlideDown 0.8s ease forwards 0.2s;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: clamp(42px, 8vw, 96px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
            opacity: 0;
            animation: fadeSlideDown 0.8s ease forwards 0.4s;
        }

        .logo-otaku {
            color: #fff;
            text-shadow: 0 0 40px rgba(255,255,255,0.3);
        }

        .logo-net {
            color: var(--cyan);
            text-shadow: 0 0 30px var(--cyan-glow), 0 0 80px var(--cyan-glow);
            position: relative;
        }

        .logo-net::after {
            content: 'NET';
            position: absolute;
            inset: 0;
            color: var(--cyan);
            filter: blur(12px);
            opacity: 0.5;
        }

        .logo-jp {
            display: block;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 12px;
            color: var(--muted);
            margin-top: 6px;
            opacity: 0;
            animation: fadeSlideDown 0.8s ease forwards 0.6s;
        }

        .header-line {
            margin: 28px auto 0;
            width: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--crimson), var(--cyan), transparent);
            animation: lineExpand 1s ease forwards 1s;
        }

        @keyframes lineExpand {
            to { width: 600px; }
        }

        /* ── SEARCH ZONE ── */
        .search-zone {
            margin: 52px auto 0;
            max-width: 680px;
            opacity: 0;
            animation: fadeSlideUp 0.8s ease forwards 0.9s;
        }

        .search-label {
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-label::before,
        .search-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .search-row {
            display: flex;
            gap: 0;
            position: relative;
        }

        .input-wrap {
            position: relative;
            flex: 1;
        }

        .corner {
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: var(--cyan);
            border-style: solid;
            border-width: 0;
            z-index: 2;
        }
        .corner-tl { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
        .corner-tr { top: -1px; right: 50px; border-top-width: 2px; border-right-width: 2px; }
        .corner-bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
        .corner-br { bottom: -1px; right: 50px; border-bottom-width: 2px; border-right-width: 2px; }

        #animeInput {
            width: 100%;
            padding: 18px 24px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-right: none;
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
            backdrop-filter: blur(20px);
        }

        #animeInput::placeholder { color: var(--muted); font-weight: 300; }

        #animeInput:focus {
            border-color: var(--cyan);
            background: rgba(0,245,255,0.04);
            box-shadow: inset 0 0 20px rgba(0,245,255,0.05);
        }

        .search-btn {
            padding: 18px 28px;
            background: linear-gradient(135deg, var(--crimson), #cc0033);
            border: 1px solid var(--crimson);
            color: #fff;
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .search-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .search-btn:hover {
            background: linear-gradient(135deg, #ff3355, #ff0033);
            box-shadow: 0 0 30px var(--crimson-glow), 0 0 60px rgba(255,34,68,0.3);
            transform: translateX(1px);
        }

        .search-btn:hover::before { opacity: 1; }

        .search-btn:active { transform: scale(0.98); }

        /* ── AUTOCOMPLETE ── */
        #autocomplete-list {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--panel);
            border: 1px solid rgba(0,245,255,0.2);
            backdrop-filter: blur(20px);
            z-index: 100;
            overflow: hidden;
            border-radius: 0 0 4px 4px;
        }

        #autocomplete-list div {
            padding: 14px 24px;
            cursor: pointer;
            font-size: 16px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s, color 0.2s, padding-left 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #autocomplete-list div::before {
            content: '▸';
            color: var(--crimson);
            font-size: 10px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        #autocomplete-list div:hover {
            background: rgba(0,245,255,0.06);
            color: var(--cyan);
            padding-left: 30px;
        }

        #autocomplete-list div:hover::before { opacity: 1; }

        /* ── SPINNER ── */
        .spinner-wrap {
            display: none;
            text-align: center;
            padding: 60px 0;
        }

        .spinner-ring {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border: 2px solid var(--border);
            border-top-color: var(--crimson);
            border-right-color: var(--cyan);
            border-radius: 50%;
            animation: spinRing 0.8s linear infinite;
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .spinner-text {
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--muted);
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* ── SECTION HEADER ── */
        .section-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 64px 0 32px;
            opacity: 0;
            transition: opacity 0.6s;
        }

        .section-header.visible { opacity: 1; }

        .section-title {
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 5px;
            color: var(--cyan);
        }

        .section-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border), transparent);
        }

        .section-count {
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            color: var(--muted);
        }

        /* ── GRID ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
        }

        /* ── CARD ── */
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.23,1,0.32,1), border-color 0.3s, box-shadow 0.4s;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(30px);
            animation: cardIn 0.6s cubic-bezier(0.23,1,0.32,1) forwards;
        }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--crimson);
            box-shadow:
                0 20px 60px rgba(0,0,0,0.6),
                0 0 20px var(--crimson-glow),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }

        /* card glow sweep on hover */
        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,34,68,0.08), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .card:hover::after { opacity: 1; }

        /* corner accent */
        .card-corner {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 28px 28px 0;
            border-color: transparent var(--crimson) transparent transparent;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 3;
        }

        .card:hover .card-corner { opacity: 1; }

        .card-img-wrap {
            position: relative;
            overflow: hidden;
            aspect-ratio: 3/4;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.23,1,0.32,1), filter 0.4s;
            filter: saturate(0.9);
        }

        .card:hover .card-img-wrap img {
            transform: scale(1.08);
            filter: saturate(1.1) brightness(1.05);
        }

        /* rank badge */
        .rank-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 36px;
            height: 36px;
            background: rgba(4,6,15,0.85);
            border: 1px solid var(--cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            font-weight: 700;
            color: var(--cyan);
            z-index: 2;
            clip-path: polygon(0 0, 100% 0, 100% 75%, 75% 100%, 0 100%);
        }

        /* image overlay gradient */
        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(4,6,15,0.95) 0%, transparent 100%);
            z-index: 1;
        }

        .card-body {
            padding: 14px 16px 16px;
        }

        .card-title {
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.4;
            color: #fff;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .card-score {
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            font-weight: 700;
            color: var(--gold);
        }

        .score-star {
            font-size: 10px;
            color: var(--gold);
            filter: drop-shadow(0 0 4px rgba(255,215,0,0.6));
        }

        .card-genres {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .genre-tag {
            padding: 3px 8px;
            background: rgba(0,245,255,0.07);
            border: 1px solid rgba(0,245,255,0.15);
            font-size: 10px;
            letter-spacing: 0.5px;
            color: var(--cyan);
            font-weight: 600;
            white-space: nowrap;
            clip-path: polygon(4px 0%, 100% 0%, calc(100% - 4px) 100%, 0% 100%);
        }

        /* ── EMPTY/ERROR STATE ── */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            filter: grayscale(0.5);
        }

        .empty-title {
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            letter-spacing: 3px;
            margin-bottom: 8px;
            color: var(--crimson);
        }

        .empty-sub {
            font-size: 14px;
            font-weight: 300;
        }

        /* ── ANIMATIONS ── */
        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--deep); }
        ::-webkit-scrollbar-thumb { background: var(--crimson); }

        /* ── FOOTER ── */
        footer {
            text-align: center;
            padding: 32px 0 0;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--muted);
            font-family: 'Orbitron', monospace;
            border-top: 1px solid var(--border);
            margin-top: 80px;
        }

        footer span { color: var(--crimson); }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="bg-radial"></div>
<div class="bg-noise"></div>
<div class="scanlines"></div>

<div class="wrapper">

    <!-- HEADER -->
    <header>
        <div class="logo-badge">オタクネット · Anime Discovery Engine</div>
        <div class="logo">
            <span class="logo-otaku">OTAKU</span><span class="logo-net">NET</span>
            <small class="logo-jp">あなたの次のアニメを見つける</small>
        </div>
        <div class="header-line"></div>
    </header>

    <!-- SEARCH -->
    <div class="search-zone">
        <div class="search-label">DISCOVER YOUR NEXT OBSESSION</div>
        <div class="search-row">
            <div class="input-wrap">
                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>
                <input type="text" id="animeInput" placeholder="Enter anime title..." oninput="autocompleteSearch()" onkeydown="if(event.key==='Enter') getRecommendations()">
                <div id="autocomplete-list"></div>
            </div>
            <button class="search-btn" onclick="getRecommendations()">SEARCH</button>
        </div>
    </div>

    <!-- SPINNER -->
    <div class="spinner-wrap" id="spinner">
        <div class="spinner-ring"></div>
        <div class="spinner-text">SCANNING DATABASE...</div>
    </div>

    <!-- SECTION HEADER -->
    <div class="section-header" id="section-header">
        <div class="section-title">RECOMMENDATIONS</div>
        <div class="section-line"></div>
        <div class="section-count" id="result-count"></div>
    </div>

    <!-- RESULTS GRID -->
    <div class="grid" id="results"></div>

    <footer>OTAKUNET &nbsp;·&nbsp; <span>アニメ</span> DISCOVERY ENGINE &nbsp;·&nbsp; 2025</footer>
</div>

<script>

// ── AUTOCOMPLETE ──
async function autocompleteSearch() {
    const query = document.getElementById("animeInput").value;
    const list = document.getElementById("autocomplete-list");
    list.innerHTML = "";
    if (query.length < 2) return;

    try {
        const response = await fetch(`/search?query=${encodeURIComponent(query)}`);
        const data = await response.json();

        data.results.forEach(title => {
            const item = document.createElement("div");
            item.textContent = title;
            item.onclick = () => {
                document.getElementById("animeInput").value = title;
                list.innerHTML = "";
            };
            list.appendChild(item);
        });
    } catch(e) {}
}

// close autocomplete on outside click
document.addEventListener("click", e => {
    if (!e.target.closest(".input-wrap"))
        document.getElementById("autocomplete-list").innerHTML = "";
});

// ── RECOMMEND ──
async function getRecommendations() {
    const title = document.getElementById("animeInput").value.trim();
    if (!title) return;

    const spinner = document.getElementById("spinner");
    const resultsDiv = document.getElementById("results");
    const sectionHeader = document.getElementById("section-header");
    const resultCount = document.getElementById("result-count");

    resultsDiv.innerHTML = "";
    sectionHeader.classList.remove("visible");
    spinner.style.display = "block";

    try {
        const response = await fetch(`/recommend?title=${encodeURIComponent(title)}`);
        const data = await response.json();

        spinner.style.display = "none";

        if (data.error || !data.recommendations?.length) {
            resultsDiv.innerHTML = `
                <div class="empty-state" style="grid-column:1/-1">
                    <div class="empty-icon">⛩</div>
                    <div class="empty-title">NO SIGNAL FOUND</div>
                    <div class="empty-sub">The anime you seek is beyond our radar</div>
                </div>`;
            return;
        }

        sectionHeader.classList.add("visible");
        resultCount.textContent = `${data.recommendations.length} TITLES`;

        data.recommendations.forEach((anime, i) => {
            const card = document.createElement("div");
            card.className = "card";
            card.style.animationDelay = `${i * 60}ms`;

            // genre tags (split string if needed)
            const genreList = typeof anime.genres === 'string'
                ? anime.genres.split(',').map(g => g.trim()).filter(Boolean)
                : (Array.isArray(anime.genres) ? anime.genres : []);

            const genreTags = genreList.slice(0,3).map(g =>
                `<span class="genre-tag">${g}</span>`
            ).join('');

            card.innerHTML = `
                <div class="card-corner"></div>
                <div class="card-img-wrap">
                    <span class="rank-badge">${String(i+1).padStart(2,'0')}</span>
                    <img src="${anime.image_url || ''}" alt="${anime.title}"
                         onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22280%22><rect fill=%22%231e293b%22 width=%22200%22 height=%22280%22/><text fill=%22%23334155%22 font-size=%2240%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22 x=%22100%22 y=%22140%22>⛩</text></svg>'">
                    <div class="card-overlay"></div>
                </div>
                <div class="card-body">
                    <div class="card-title">${anime.title}</div>
                    <div class="card-meta">
                        <div class="card-score">
                            <span class="score-star">★</span>
                            ${parseFloat(anime.score).toFixed(1) || 'N/A'}
                        </div>
                    </div>
                    <div class="card-genres">${genreTags}</div>
                </div>
            `;

            resultsDiv.appendChild(card);
        });

    } catch(e) {
        spinner.style.display = "none";
        resultsDiv.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1">
                <div class="empty-icon">⚡</div>
                <div class="empty-title">CONNECTION ERROR</div>
                <div class="empty-sub">Signal lost. Please try again.</div>
            </div>`;
    }
}
</script>

<script>
// ══════════════════════════════════════════════
//   ANIMATED BACKGROUND — Canvas Engine
// ══════════════════════════════════════════════

(function() {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    let W, H, mouse = { x: -9999, y: -9999 };

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

    // ── Kanji pool ──
    const KANJI = '斬撃炎氷神風夢幻鬼魂剣刀雷龍鳳凰魔界光影闇力空時命運戦破壊創造英雄';

    // ── COLOR PALETTE ──
    const CYAN    = 'rgba(0,245,255,';
    const CRIMSON = 'rgba(255,34,68,';
    const PURPLE  = 'rgba(160,32,255,';
    const GOLD    = 'rgba(255,200,0,';
    const WHITE   = 'rgba(255,255,255,';

    // ════════════════════════════
    //  1. GRID LINES (perspective)
    // ════════════════════════════
    const grid = {
        offsetY: 0,
        speed: 0.4,
        cols: 22,
        rows: 14,

        draw() {
            this.offsetY = (this.offsetY + this.speed) % (H / this.rows);
            const cellW = W / this.cols;
            const cellH = H / this.rows;

            ctx.save();
            ctx.strokeStyle = 'rgba(0,245,255,0.04)';
            ctx.lineWidth = 1;

            // vertical lines
            for (let x = 0; x <= this.cols; x++) {
                ctx.beginPath();
                ctx.moveTo(x * cellW, 0);
                ctx.lineTo(x * cellW, H);
                ctx.stroke();
            }
            // horizontal lines (drifting downward)
            for (let y = -1; y <= this.rows + 1; y++) {
                const yPos = y * cellH + this.offsetY;
                ctx.globalAlpha = 0.4 + 0.6 * (yPos / H);
                ctx.beginPath();
                ctx.moveTo(0, yPos);
                ctx.lineTo(W, yPos);
                ctx.stroke();
            }
            ctx.restore();
        }
    };

    // ════════════════════════════
    //  2. FLOATING KANJI GLYPHS
    // ════════════════════════════
    class KanjiGlyph {
        constructor() { this.reset(true); }

        reset(initial = false) {
            this.x    = Math.random() * W;
            this.y    = initial ? Math.random() * H : -60;
            this.char = KANJI[Math.floor(Math.random() * KANJI.length)];
            this.size = 14 + Math.random() * 28;
            this.speed = 0.3 + Math.random() * 0.7;
            this.opacity = 0;
            this.maxOpacity = 0.06 + Math.random() * 0.1;
            this.fadeDir = 1;
            this.color = [CYAN, CRIMSON, PURPLE, WHITE][Math.floor(Math.random() * 4)];
            this.rotation = (Math.random() - 0.5) * 0.4;
            this.rotSpeed = (Math.random() - 0.5) * 0.003;
            this.angle    = 0;
        }

        update() {
            this.y += this.speed;
            this.angle += this.rotSpeed;
            this.opacity += 0.003 * this.fadeDir;
            if (this.opacity >= this.maxOpacity) this.fadeDir = -1;
            if (this.opacity <= 0 && this.fadeDir === -1) this.reset();
            if (this.y > H + 80) this.reset();
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.font = `${this.size}px 'Noto Sans JP', serif`;
            ctx.fillStyle = this.color + this.opacity + ')';
            ctx.textAlign = 'center';
            ctx.fillText(this.char, 0, 0);
            ctx.restore();
        }
    }

    // ════════════════════════════
    //  3. SAKURA PETALS
    // ════════════════════════════
    class Petal {
        constructor() { this.reset(true); }

        reset(initial = false) {
            this.x     = Math.random() * W;
            this.y     = initial ? Math.random() * H : -20;
            this.size  = 3 + Math.random() * 5;
            this.speedY = 0.5 + Math.random() * 1.2;
            this.speedX = (Math.random() - 0.5) * 0.8;
            this.wobble = Math.random() * Math.PI * 2;
            this.wobbleSpeed = 0.015 + Math.random() * 0.02;
            this.opacity = 0.4 + Math.random() * 0.4;
            this.angle  = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.04;
            // soft pinks / whites
            const h = 330 + Math.random() * 30;
            const l = 75 + Math.random() * 20;
            this.color = `hsla(${h},80%,${l}%,`;
        }

        update() {
            this.wobble += this.wobbleSpeed;
            this.x += this.speedX + Math.sin(this.wobble) * 0.6;
            this.y += this.speedY;
            this.angle += this.rotSpeed;
            if (this.y > H + 20) this.reset();
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.fillStyle = this.color + this.opacity + ')';
            // draw a simple petal shape
            ctx.beginPath();
            ctx.ellipse(0, 0, this.size, this.size * 1.7, 0, 0, Math.PI * 2);
            ctx.fill();
            // petal shimmer
            ctx.fillStyle = this.color + (this.opacity * 0.3) + ')';
            ctx.beginPath();
            ctx.ellipse(this.size * 0.2, -this.size * 0.3, this.size * 0.3, this.size * 0.6, 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // ════════════════════════════
    //  4. ENERGY ORBS / SPIRITS
    // ════════════════════════════
    class Orb {
        constructor() { this.reset(true); }

        reset(initial = false) {
            this.x     = Math.random() * W;
            this.y     = initial ? Math.random() * H : H + 40;
            this.r     = 2 + Math.random() * 4;
            this.speedY = -(0.3 + Math.random() * 0.8);
            this.speedX = (Math.random() - 0.5) * 0.5;
            this.life   = 0;
            this.maxLife = 180 + Math.random() * 300;
            this.colors = [
                [CYAN, 0.6],
                [CRIMSON, 0.5],
                [PURPLE, 0.5],
                [GOLD, 0.5],
            ];
            const c = this.colors[Math.floor(Math.random() * this.colors.length)];
            this.colorStr = c[0];
            this.maxOpacity = c[1];
            this.trail = [];
        }

        update() {
            this.life++;
            this.trail.push({ x: this.x, y: this.y });
            if (this.trail.length > 16) this.trail.shift();

            // mouse repulsion
            const dx = this.x - mouse.x;
            const dy = this.y - mouse.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 120) {
                this.speedX += (dx / dist) * 0.15;
                this.speedY += (dy / dist) * 0.15;
            }

            this.speedX *= 0.98;
            this.speedY *= 0.98;
            this.x += this.speedX;
            this.y += this.speedY;

            if (this.life > this.maxLife || this.y < -40) this.reset();
        }

        draw() {
            const progress = this.life / this.maxLife;
            const opacity  = this.maxOpacity * Math.sin(progress * Math.PI);

            // draw trail
            for (let i = 0; i < this.trail.length; i++) {
                const t = i / this.trail.length;
                const tr = this.trail[i];
                ctx.beginPath();
                ctx.arc(tr.x, tr.y, this.r * t * 0.8, 0, Math.PI * 2);
                ctx.fillStyle = this.colorStr + (opacity * t * 0.4) + ')';
                ctx.fill();
            }

            // core glow
            const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 6);
            grd.addColorStop(0,   this.colorStr + opacity + ')');
            grd.addColorStop(0.3, this.colorStr + (opacity * 0.5) + ')');
            grd.addColorStop(1,   this.colorStr + '0)');
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r * 6, 0, Math.PI * 2);
            ctx.fillStyle = grd;
            ctx.fill();

            // bright core
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.fillStyle = WHITE + (opacity * 0.9) + ')';
            ctx.fill();
        }
    }

    // ════════════════════════════
    //  5. LIGHTNING ARCS
    // ════════════════════════════
    class Lightning {
        constructor() { this.reset(); }

        reset() {
            this.active  = false;
            this.timer   = 80 + Math.random() * 200;
            this.segments = [];
            this.opacity  = 0;
        }

        trigger() {
            this.active   = true;
            this.opacity  = 0.7 + Math.random() * 0.3;
            this.lifetime = 8 + Math.random() * 10;
            this.age      = 0;
            const x1 = Math.random() * W;
            const y1 = Math.random() * H * 0.6;
            this.segments = this.buildArc(x1, y1, x1 + (Math.random() - 0.5) * 300, y1 + 100 + Math.random() * 200);
            this.colorStr = Math.random() > 0.5 ? CYAN : PURPLE;
        }

        buildArc(x1, y1, x2, y2, depth = 0) {
            if (depth > 5) return [{ x: x1, y: y1 }, { x: x2, y: y2 }];
            const mx = (x1 + x2) / 2 + (Math.random() - 0.5) * (80 >> depth);
            const my = (y1 + y2) / 2 + (Math.random() - 0.5) * (80 >> depth);
            return [
                ...this.buildArc(x1, y1, mx, my, depth + 1),
                ...this.buildArc(mx, my, x2, y2, depth + 1)
            ];
        }

        update() {
            if (!this.active) {
                this.timer--;
                if (this.timer <= 0) this.trigger();
                return;
            }
            this.age++;
            if (this.age > this.lifetime) this.reset();
        }

        draw() {
            if (!this.active || this.segments.length < 2) return;
            const fade = 1 - this.age / this.lifetime;
            ctx.save();
            ctx.strokeStyle = this.colorStr + (this.opacity * fade * 0.6) + ')';
            ctx.lineWidth = 1;
            ctx.shadowColor = this.colorStr + '0.8)';
            ctx.shadowBlur  = 8;
            ctx.beginPath();
            ctx.moveTo(this.segments[0].x, this.segments[0].y);
            for (let i = 1; i < this.segments.length; i++) {
                ctx.lineTo(this.segments[i].x, this.segments[i].y);
            }
            ctx.stroke();
            ctx.restore();
        }
    }

    // ════════════════════════════
    //  6. PULSE RINGS (on-screen)
    // ════════════════════════════
    class PulseRing {
        constructor() { this.reset(true); }

        reset(initial = false) {
            this.x = Math.random() * W;
            this.y = Math.random() * H;
            this.r = 0;
            this.maxR = 60 + Math.random() * 100;
            this.speed = 0.4 + Math.random() * 0.5;
            this.delay = initial ? Math.random() * 200 : 0;
            this.colorStr = [CYAN, CRIMSON, PURPLE][Math.floor(Math.random() * 3)];
        }

        update() {
            if (this.delay > 0) { this.delay--; return; }
            this.r += this.speed;
            if (this.r > this.maxR) this.reset();
        }

        draw() {
            if (this.delay > 0 || this.r === 0) return;
            const t = this.r / this.maxR;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
            ctx.strokeStyle = this.colorStr + (0.15 * (1 - t)) + ')';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }

    // ── Instantiate ──
    const kanjis    = Array.from({ length: 30  }, () => new KanjiGlyph());
    const petals    = Array.from({ length: 50  }, () => new Petal());
    const orbs      = Array.from({ length: 22  }, () => new Orb());
    const bolts     = Array.from({ length: 3   }, () => new Lightning());
    const pulseRings = Array.from({ length: 10 }, () => new PulseRing());

    // ── Main loop ──
    function loop() {
        ctx.clearRect(0, 0, W, H);

        // deep base
        ctx.fillStyle = '#04060f';
        ctx.fillRect(0, 0, W, H);

        grid.draw();

        pulseRings.forEach(r => { r.update(); r.draw(); });
        kanjis.forEach(k   => { k.update(); k.draw(); });
        petals.forEach(p   => { p.update(); p.draw(); });
        bolts.forEach(b    => { b.update(); b.draw(); });
        orbs.forEach(o     => { o.update(); o.draw(); });

        requestAnimationFrame(loop);
    }

    loop();
})();
</script>
</body>
